# Deploy do signaling no Render (free tier).
# Uso: New > Blueprint > aponte para este repositorio.
#
# Uma instancia: salas e clientes ficam em memoria. Suspensao do servico
# pode atrasar a entrada; o tempo de inicializacao nao e garantido.
services:
  - type: web
    name: voxa-signaling
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"  # somente atras do proxy confiavel do Render
      - key: ORIGIN
        value: "*"
      - key: VOXA_MAX_VIEWERS
        value: "4"
