[package]
name = "voxa"
version = "0.5.7"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "voxa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.4"

[target.'cfg(windows)'.dependencies]
# Mesma versao que o wry usa (0.38.2) — precisa bater pra compartilhar os tipos COM.
webview2-com = "0.38"
# GetUserDefaultUILanguage: descobre o idioma do titulo da fonte de captura.
windows = { version = "0.61", features = [
  "Win32_Globalization",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Graphics_Dwm",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
