name: ci

# Valida o painel, o matchmaking e o protocolo nativo em todo push e PR.
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Tipos, build e testes
    # Fixado para impedir que uma troca automatica de imagem altere o CI sem revisao.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci --prefix server

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build de producao
        run: npx vite build

      - name: Testes do servidor
        run: npm run verify

  rust:
    name: Rust
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # O build do Tauri exige a pasta dist; um placeholder basta para
      # compilar o backend sem precisar do bundle do frontend aqui.
      - name: Placeholder do frontend
        run: New-Item -ItemType Directory -Force dist | Out-Null; Set-Content dist/index.html "<html></html>"
        shell: pwsh

      - name: Formatacao
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: Testes Rust e carregador WebView2 fixado
        run: node scripts/test-rust.mjs
