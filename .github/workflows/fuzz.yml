name: fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-packets:
    name: UDP, FEC e remontagem
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action
        with:
          toolchain: nightly
      - name: Instalar cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: Fuzz do protocolo cifrado
        working-directory: src-tauri/native-core
        run: cargo fuzz run protocol -- -max_total_time=120 -timeout=5
      - name: Fuzz de FEC e remontagem
        working-directory: src-tauri/native-core
        run: cargo fuzz run reassembly -- -max_total_time=120 -timeout=5
