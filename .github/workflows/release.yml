name: release

# Publica o instalador assinado + latest.json (o arquivo que o auto-update le).
# Dispare criando uma tag:  git tag v0.1.3 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Sem isto, o GITHUB_TOKEN herda permissoes amplas do repositorio. O job so
# precisa criar release e enviar arquivos.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # As acoes de terceiros rodam no MESMO job que recebe a chave privada de
      # assinatura. Uma tag como @v4 e mutavel: quem controlar o repositorio da
      # acao pode reapontar a tag e passar a executar codigo proprio aqui
      # dentro, com acesso aos secrets. Por isso cada uma esta presa ao commit
      # exato, com a versao anotada ao lado para facilitar a atualizacao.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # `npm ci` respeita o package-lock e falha se ele divergir do
      # package.json — build reprodutivel, sem resolver versao nova sozinho.
      - name: Dependencias
        run: npm ci

      # As variaveis VITE_* sao gravadas DENTRO do bundle no momento do build.
      # Se um secret estiver vazio, o Vite injeta string vazia e o app se
      # comporta como se aquilo nao existisse — sem erro, sem log, sem nada.
      #
      # Foi assim que o historico do chat ficou quebrado desde sempre: o
      # secret do Supabase estava vazio, `supabaseEnabled` virava false, e o
      # app simplesmente nunca falava com o banco. Levou uma investigacao
      # inteira pra descobrir, porque nao havia sintoma nenhum alem de o
      # historico estar vazio.
      #
      # Nao imprime valor nenhum: so o nome do que faltou.
      - name: Conferir variaveis do build
        shell: bash
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SIGNALING_URL" ]; then
            echo "::error::VITE_SIGNALING_URL vazio — o app cairia em localhost e ninguem se conectaria."
            exit 1
          fi

          faltando=""
          [ -n "$VITE_SUPABASE_URL" ]      || faltando="$faltando VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || faltando="$faltando VITE_SUPABASE_ANON_KEY"

          if [ -n "$faltando" ]; then
            # Aviso, nao erro: o Supabase e opcional por design — sem ele o
            # chat funciona em tempo real, so nao guarda historico.
            echo "::warning::Supabase incompleto ($faltando ). Esta versao vai SEM historico de chat."
          else
            echo "Todas as variaveis do build estao presentes."
          fi

      - name: Build e publicacao
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chave privada de assinatura do updater (conteudo de .keys/voxa.key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # O .env nao vai para o repositorio: as URLs entram como secrets.
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # VITE_ROOM_TOKEN fica de fora de proposito: o Vite grava qualquer
          # VITE_* dentro do bundle, e o instalador e publico. A senha da sala
          # e digitada pelo usuario na tela de entrada.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voxa __VERSION__"
          releaseBody: "Instale o `.exe`. Quem ja tem o app atualiza sozinho."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # O updater le /releases/latest/download/latest.json, e quem decide o que
      # e "latest" e o GitHub: por padrao, a ULTIMA release publicada — nao a de
      # maior versao. Publicando duas tags quase juntas, a que terminar de
      # compilar depois rouba o rotulo, e todo mundo fica preso na versao
      # antiga sem nenhum sinal de que algo deu errado. Foi o que aconteceu com
      # a v0.5.4: a v0.5.3 terminou 2 minutos depois e virou a "latest".
      #
      # A comparacao com `sort -V` existe para o caso inverso: se uma release
      # MAIS NOVA ja estiver publicada, esta aqui nao rebaixa ela.
      - name: Garantir que a maior versao e a "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          atual="${GITHUB_REF_NAME#v}"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest="${latest#v}"
          maior=$( { echo "$atual"; echo "$latest"; } | sort -V | tail -1 )

          if [ -n "$latest" ] && [ "$maior" != "$atual" ]; then
            echo "v$latest e mais nova que v$atual — mantendo como latest."
            exit 0
          fi

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f make_latest=true >/dev/null
          echo "v$atual marcada como latest."
