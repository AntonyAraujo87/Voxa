name: release

# Publica o instalador assinado + latest.json (o arquivo que o auto-update le).
# Dispare criando uma tag:  git tag v0.1.3 && git push --tags
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Sem isto, o GITHUB_TOKEN herda permissoes amplas do repositorio. O job so
# precisa criar release e enviar arquivos.
permissions:
  contents: write

concurrency:
  group: voxa-releases
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validation
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      # As acoes de terceiros rodam no MESMO job que recebe a chave privada de
      # assinatura. Uma tag como @v4 e mutavel: quem controlar o repositorio da
      # acao pode reapontar a tag e passar a executar codigo proprio aqui
      # dentro, com acesso aos secrets. Por isso cada uma esta presa ao commit
      # exato, com a versao anotada ao lado para facilitar a atualizacao.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Conferir tag e versao
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'A release exige uma tag vVERSAO igual ao package.json' }

      - name: Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache do Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # `npm ci` respeita o package-lock e falha se ele divergir do
      # package.json — build reprodutivel, sem resolver versao nova sozinho.
      - name: Dependencias
        run: npm ci

      # O painel recebe apenas a URL de matchmaking. Nenhum segredo de mídia
      # entra no bundle web; captura, cifra e transporte pertencem ao Rust.
      - name: Conferir variaveis do build
        shell: bash
        env:
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
        run: |
          if [ -z "$VITE_SIGNALING_URL" ]; then
            echo "::error::VITE_SIGNALING_URL vazio — o painel não encontraria o matchmaking."
            exit 1
          fi
          case "$VITE_SIGNALING_URL" in
            https://*) ;;
            *)
              echo "::error::VITE_SIGNALING_URL deve usar HTTPS para que o Socket.IO negocie WSS."
              exit 1
              ;;
          esac
          echo "Matchmaking configurado; a mídia usa o túnel UDP nativo."

      - name: Build e publicacao
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Chave privada de assinatura do updater (conteudo de .keys/voxa.key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # O .env nao vai para o repositorio: as URLs entram como secrets.
          VITE_SIGNALING_URL: ${{ secrets.VITE_SIGNALING_URL }}
          # VITE_ROOM_TOKEN fica de fora de proposito: o Vite grava qualquer
          # VITE_* dentro do bundle, e o instalador e publico. A senha da sala
          # e digitada pelo usuario na tela de entrada.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voxa __VERSION__"
          releaseBody: "Instale o `.exe`. Quem ja tem o app atualiza sozinho."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      - name: Conferir dependencias do executavel empacotado
        run: node scripts/check-native.mjs src-tauri/target/release/voxa.exe src-tauri/target/release/nsis/x64/installer.nsi

      - name: Instalar, atualizar e desinstalar na VM Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/check-installer.ps1 -Version $version

      - name: Publicar a release validada e preservar a maior versao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-release.mjs
