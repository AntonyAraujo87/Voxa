<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      script-src precisa de 'wasm-unsafe-eval' pro RNNoise (WebAssembly) —
      diretiva do CSP nivel 3, so libera compilar/instanciar WASM, bem mais
      estreita que 'unsafe-eval' (que abriria eval() de JS arbitrario tambem).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src *; media-src * blob: mediastream:; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'" />
    <title>Voxa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
